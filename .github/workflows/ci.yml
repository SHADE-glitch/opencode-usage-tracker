name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and declared upper bound. The floor is `requires-python` in
        # pyproject.toml and the README Requirements table (3.11); the README
        # lists 3.14 as the highest version the suite was run green on. Both
        # ends of the declared range are covered.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        # `-n auto` is passed here rather than put in an `addopts`: it moves the
        # progress rendering to percentages and leaves the summary line where the
        # gate reads it (MAINTENANCE.md §11), so the log a red run produces is the
        # same shape as the serial one. The serial commands in MAINTENANCE.md §4
        # stay the record; this is the same suite, spread over the runner's cores.
        run: python3 -m pytest scripts/tests -q -n auto
